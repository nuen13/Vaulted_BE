# Copy to deploy/cloudrun.env.yaml (git-ignored) and fill in.
# Plain (non-secret) settings for the Cloud Run service. "__" is .NET's section separator.
# Secrets (JWT key, DB connection string) live in Secret Manager — see deploy/cloudrun.sh.
ASPNETCORE_ENVIRONMENT: "Production"
Auth__GoogleClientId: "YOUR_CLIENT_ID.apps.googleusercontent.com"
Auth__TokenLifetimeDays: "30"
Auth__AllowedEmails__0: "you@example.com"
# Auth__AllowedEmails__1: "friend@example.com"
# Admins can archive/delete anyone's items and entries. appsettings.json already lists one;
# setting Auth__AdminEmails__0 here replaces that entry.
# Auth__AdminEmails__0: "you@example.com"
